<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo grafito oscuro -->
    <radialGradient id="hexBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#151820" />
      <stop offset="60%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <!-- Borde Plomo / Gris Acero Plateado (#94a3b8 a #64748b) -->
    <linearGradient id="plomoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Barra de encendido roja -->
    <linearGradient id="powerRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5765" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- 1. Hexágono Exterior con bordes plomos/plateados -->
  <polygon
    points="256,36 446,146 446,366 256,476 66,366 66,146"
    fill="url(#hexBg)"
    stroke="url(#plomoBorder)"
    stroke-width="18"
    stroke-linejoin="round"
  />

  <!-- Línea interior sutil plomo oscuro -->
  <polygon
    points="256,54 430,154 430,358 256,458 82,358 82,154"
    fill="none"
    stroke="rgba(148, 163, 184, 0.15)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- 2. Símbolo de Encendido: Arco en 'U' Blanco Nítido -->
  <!-- Centro en (256, 270), radio 98 -->
  <path
    d="M 187 201 A 98 98 0 1 0 325 201"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3. Línea vertical de Encendido / Apagado (en el medio de la 'U', roja gamer) -->
  <line
    x1="256"
    y1="140"
    x2="256"
    y2="240"
    stroke="url(#powerRed)"
    stroke-width="28"
    stroke-linecap="round"
  />
</svg>
